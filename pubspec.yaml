name: daylist
description: App for college
publish_to: "none"

environment:
  sdk: ">=3.0.6 <4.0.0"

version: 1.0.16+17

dependencies:
  flutter:
    sdk: flutter

  # backend
  appwrite: ^15.0.0

  # storage
  # isar: ^3.0.5
  # isar_flutter_libs: ^3.0.5
  shared_preferences: ^2.2.0

  # state
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.3.7

  # navigate
  go_router: ^14.8.1

  # utils
  intl: ^0.19.0
  get_it: ^8.0.3
  url_launcher: ^6.1.13
  flutter_dotenv: ^5.1.0
  path_provider: ^2.0.15
  connectivity_plus: ^6.1.3
  flutter_launcher_icons: ^0.14.3

  # ui
  unicons: ^3.0.0
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.0.3
  font_awesome_flutter: ^10.5.0
  loading_animation_widget: ^1.2.0+4

  # localization
  flutter_localizations:
    sdk: flutter
  slang: ^4.6.0
  slang_flutter: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.1
  # isar_generator: ^3.0.5
  slang_build_runner: ^4.6.0

flutter:
  uses-material-design: true

  assets:
    - .env
